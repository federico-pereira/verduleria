name: Deploy Verduleria (sync repo)

on:
  push:
    branches: [ node-react ]

concurrency:
  group: deploy-verduleria
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.DEPLOY_KEY_AWS }}" > "$HOME/.ssh/id_aws"
          chmod 600 "$HOME/.ssh/id_aws"
          ssh-keyscan -p 22 54.226.78.89 >> "$HOME/.ssh/known_hosts"
          ssh-keyscan -p 22 ec2-54-226-78-89.compute-1.amazonaws.com >> "$HOME/.ssh/known_hosts"

      - name: Ensure remote dir
        env:
          SSH_HOST: 54.226.78.89
          SSH_PORT: "22"
          SSH_USER: ubuntu
          REMOTE_PATH: /home/ubuntu/verduleria
        run: |
          ssh -i "$HOME/.ssh/id_aws" -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "mkdir -p ${REMOTE_PATH}"

      - name: Sync repo to server (rsync)
        env:
          SSH_HOST: 54.226.78.89
          SSH_PORT: "22"
          SSH_USER: ubuntu
          REMOTE_PATH: /home/ubuntu/verduleria/
        run: |
          rsync -azv --delete \
            --filter=':- .gitignore' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='coverage/' \
            --exclude='.cache/' \
            --exclude='build/' \
            -e "ssh -i $HOME/.ssh/id_aws -p ${SSH_PORT}" \
            "./" "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"
