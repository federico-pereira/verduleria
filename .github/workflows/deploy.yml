name: Deploy Backend

on:
  push:
    branches: [ Backend ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/verduleria-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USER }}/backend"
          rm: true
          
      - name: Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop existing process
            pkill -f verduleria || true
            
            # Wait a moment
            sleep 5
            
            # Start new process
            # We use nohup to keep it running after disconnect
            # We point to the specific jar we just uploaded
            nohup java -jar /home/${{ secrets.EC2_USER }}/backend/target/verduleria-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
