name: Deploy Backend

on:
  push:
    branches: [ Backend ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/verduleria-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USER }}/backend"
          rm: true
          
      - name: Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create systemd service file
            sudo bash -c 'cat > /etc/systemd/system/verduleria.service <<EOF
            [Unit]
            Description=Verduleria Backend
            After=syslog.target network.target mariadb.service

            [Service]
            User=${{ secrets.EC2_USER }}
            ExecStart=/usr/bin/java -jar /home/${{ secrets.EC2_USER }}/backend/target/verduleria-0.0.1-SNAPSHOT.jar
            SuccessExitStatus=143
            Restart=always
            RestartSec=5
            StandardOutput=file:/home/${{ secrets.EC2_USER }}/app.log
            StandardError=inherit

            [Install]
            WantedBy=multi-user.target
            EOF'

            # Reload systemd and restart app
            sudo systemctl daemon-reload
            sudo systemctl enable verduleria
            sudo systemctl restart verduleria
            
            # Check status (optional, but good for logs)
            sudo systemctl status verduleria --no-pager
